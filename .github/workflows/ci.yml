name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            pdfium_asset: pdfium-mac-arm64.tgz
            pdfium_library: libpdfium.dylib
          - platform: ubuntu-22.04
            pdfium_asset: pdfium-linux-x64.tgz
            pdfium_library: libpdfium.so
          - platform: windows-latest
            pdfium_asset: ""
            pdfium_library: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install protoc (macOS)
        if: matrix.platform == 'macos-latest'
        run: brew install protobuf

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y curl libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf protobuf-compiler

      - name: Install protoc (Windows)
        if: matrix.platform == 'windows-latest'
        run: choco install protoc -y

      - name: Install PDFium binary
        if: matrix.pdfium_asset != ''
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pdfium" src-tauri/pdfium
          curl -L --fail --retry 5 --retry-delay 2 \
            -o "$RUNNER_TEMP/pdfium.tgz" \
            "https://github.com/bblanchon/pdfium-binaries/releases/latest/download/${{ matrix.pdfium_asset }}"
          tar -xzf "$RUNNER_TEMP/pdfium.tgz" -C "$RUNNER_TEMP/pdfium"
          cp "$RUNNER_TEMP/pdfium/lib/${{ matrix.pdfium_library }}" "src-tauri/pdfium/${{ matrix.pdfium_library }}"
          ls -la src-tauri/pdfium

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm install

      - name: Typecheck (tsc, force)
        # ADR-47 回归防线：--force 禁增量缓存假绿（e2522af6 教训）
        run: npm run typecheck:force

      - name: KB view artifact self-consistency
        # ADR-47 回归防线：产物存在 + builtFrom 非空（源同步漂移即红；上游源在 hub，
        # sync --check 归 hub 侧等价门禁：node scripts/build-reference-kb-view.js --check
        # + node QMAI/scripts/sync-kb-view-to-qmai.mjs --check）
        run: node -e "const v=require('./src/lib/novel/kb/kb-routing-view.generated.json');if(!v.builtFrom||!String(v.builtFrom).startsWith('sha256:'))throw new Error('builtFrom broken');console.log('kb routing view OK:',v.builtFrom)"

      - name: Governance anchors check
        # ADR-47 回归防线：治理文档（arch-decisions/project.md）声称的文件:行锚点可解析
        run: node scripts/verify-governance-anchors.mjs

      - name: Lint (eslint, 68 号 P1-9 接入)
        run: npm run lint

      - name: Run unit tests (vitest)
        run: npm run test:mocks

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # E2E 为 web 层测试（vite dev + Tauri mock，不涉平台代码）；macos runner 上
      # vite dev 长时间运行后挂起（ui-walkthrough 绿 / writing-flow root 空，本地与
      # ubuntu/windows 均绿，无法复现）——排除 macos，保留 ubuntu+windows 双平台。
      - name: Run E2E tests
        if: matrix.platform != 'macos-latest'
        run: npm run test:e2e

      - name: Run Rust cargo test
        working-directory: src-tauri
        run: cargo test

      - name: Check frontend build
        run: npx vite build

      - name: Check Rust build
        working-directory: src-tauri
        run: cargo build
