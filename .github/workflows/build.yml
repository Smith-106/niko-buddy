name: Niko Buddy Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# CI 门（P0 #2）：
# ci-gate 委托 ci.yml workflow_call（同仓 reusable workflow 在 caller commit 运行），
# 门定义单份化；build 依赖 ci-gate 全绿后才启动。
jobs:
  ci-gate:
    name: Release CI Gate
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci-gate
    if: github.event_name == 'push' && github.ref_type == 'tag' && github.repository == 'Smith-106/niko-buddy'
    name: Build signed ${{ matrix.display_label }}
    environment: windows-release-signing
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      CARGO_PROFILE_RELEASE_OPT_LEVEL: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x64
            display_label: Windows x64
            runner: windows-latest
            rust_targets: ""
            tauri_args: "--bundles nsis"
            pdfium_asset: ""
            pdfium_library: ""

          # Windows-only 发布（2026-10-14 用户指令：暂只用 Windows；macOS/Linux 条目已移除，需恢复时从 git 历史找回）

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust stable
        if: matrix.rust_targets == ''
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust stable with targets
        if: matrix.rust_targets != ''
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            protobuf-compiler \
            wget \
            xdg-utils

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install protobuf

      # protoc 与同 job 的 Linux(apt protobuf-compiler) / macOS(brew protobuf)
      # 保持同源包管理器口径；原 arduino/setup-protoc@v3 声明 node20 运行时且
      # 无 node24 版本可用（最新 major 仍为 v3.0.0），属 B4 Node-20 EOL 清偿面。
      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install protoc --no-progress -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$env:ProgramData\chocolatey\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # R2 残量（B4 清偿面）：Windows 的 choco 路径是本次新换的 protoc 来源，
      # 而 build.yml 仅 tag / workflow_dispatch 触发，本地无法预热验证——三平台在
      # 此统一断言，让工具链缺失以显式一步失败，而非在 cargo 构建里以晦涩错误暴露。
      # 首次 tag 发布必须确认本步骤绿（登记：product-release-acceptance-checklist E9）。
      - name: Verify protoc
        shell: bash
        run: protoc --version

      - name: Install PDFium binary
        if: matrix.pdfium_asset != ''
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pdfium" src-tauri/pdfium
          curl -L --fail --retry 5 --retry-delay 2 \
            -o "$RUNNER_TEMP/pdfium.tgz" \
            "https://github.com/bblanchon/pdfium-binaries/releases/latest/download/${{ matrix.pdfium_asset }}"
          tar -xzf "$RUNNER_TEMP/pdfium.tgz" -C "$RUNNER_TEMP/pdfium"
          cp "$RUNNER_TEMP/pdfium/lib/${{ matrix.pdfium_library }}" "src-tauri/pdfium/${{ matrix.pdfium_library }}"
          ls -la src-tauri/pdfium

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Check signed release source
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          test "$GITHUB_REF_NAME" = "v$version"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "${GITHUB_SHA}^{commit}")"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "${GITHUB_REF}^{commit}")"
          git merge-base --is-ancestor HEAD refs/remotes/origin/master

      - name: Install frontend dependencies
        run: npm ci

      - name: Prepare release notes
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          mkdir -p release-assets
          node scripts/release-notes.mjs "$version" --out release-assets/release-notes.txt

      - name: Build signed Tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.WINDOWS_RELEASE_TAURI_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.WINDOWS_RELEASE_TAURI_PASSWORD }}
        run: npx tauri build ${{ matrix.tauri_args }} --config src-tauri/tauri.ci.conf.json

      - name: Prepare Windows updater manifest
        if: matrix.label == 'windows-x64'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = node -p "require('./package.json').version"
          $bundleDir = "src-tauri/target/release/bundle/nsis"
          $installers = @(Get-ChildItem $bundleDir -File -Filter '*.exe')
          if ($installers.Count -ne 1) { throw 'Expected exactly one Windows NSIS installer' }
          $installer = $installers[0]
          $signaturePath = "$($installer.FullName).sig"
          if (-not (Test-Path -LiteralPath $signaturePath -PathType Leaf)) { throw 'The CI build did not produce an updater signature' }

          $releaseDir = "release-assets"
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null

          $assetName = "niko-buddy_$($version)_windows_X64$($installer.Extension)"
          $assetPath = Join-Path $releaseDir $assetName
          $assetSignaturePath = "$assetPath.sig"
          Copy-Item $installer.FullName $assetPath -Force

          $signature = (Get-Content $signaturePath -Raw).Trim()
          Copy-Item $signaturePath $assetSignaturePath -Force
          $notesPath = Join-Path $releaseDir "release-notes.txt"
          $notes = Get-Content -Path $notesPath -Raw -Encoding utf8
          $latest = [ordered]@{
            version = $version
            notes = $notes
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ss.fffZ", [System.Globalization.CultureInfo]::InvariantCulture)
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = $signature
                url = "https://github.com/$($env:GITHUB_REPOSITORY)/releases/download/$($env:GITHUB_REF_NAME)/$assetName"
              }
            }
          }

          $latestPath = Join-Path $releaseDir "latest.json"
          $latest | ConvertTo-Json -Depth 5 | Set-Content -Path $latestPath -Encoding utf8

      - name: Package macOS release assets
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [ "${{ matrix.label }}" = "macos-intel" ]; then
            system_label="macOS_Intel"
          else
            system_label="macOS_AppleSilicon"
          fi
          mkdir -p release-assets

          dmg_path="$(find src-tauri/target -path '*/release/bundle/dmg/*.dmg' -print -quit)"
          if [ -n "$dmg_path" ]; then
            cp "$dmg_path" "release-assets/niko-buddy_${version}_${system_label}.dmg"
          fi

          app_path="$(find src-tauri/target -path '*/release/bundle/macos/*.app' -print -quit)"
          if [ -z "$app_path" ]; then
            echo "No .app bundle found"
            exit 1
          fi
          tar -C "$(dirname "$app_path")" -czf "release-assets/niko-buddy_${version}_${system_label}.app.tar.gz" "$(basename "$app_path")"

      - name: Build Windows portable
        if: matrix.label == 'windows-x64'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = node -p "require('./package.json').version"
          node scripts/build-portable.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $portableExe = "release-portable/niko-buddy.exe"
          if (-not (Test-Path $portableExe)) {
            throw "便携版 EXE 未生成：$portableExe"
          }
          $assetName = "niko-buddy_${version}_windows_X64_portable.exe"
          $assetPath = "release-assets/$assetName"
          New-Item -ItemType Directory -Force -Path "release-assets" | Out-Null
          Copy-Item $portableExe $assetPath -Force

      - name: Verify Windows release files
        if: matrix.label == 'windows-x64'
        run: node scripts/verify-windows-release-assets.mjs release-assets

      - name: Stage verified release files
        if: matrix.label == 'windows-x64'
        uses: actions/upload-artifact@v6
        with:
          name: windows-release-files
          path: release-assets/
          if-no-files-found: error
          retention-days: 14

  build-unsigned:
    needs: ci-gate
    if: github.event_name == 'workflow_dispatch'
    name: Build unsigned Windows test package
    runs-on: windows-latest
    env:
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      CARGO_PROFILE_RELEASE_OPT_LEVEL: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Windows dependencies
        shell: pwsh
        run: |
          choco install protoc --no-progress -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$env:ProgramData\chocolatey\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Verify protoc
        run: protoc --version
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Build unsigned Tauri app
        run: npx tauri build --bundles nsis
      - name: Upload bundles as workflow artifacts
        uses: actions/upload-artifact@v6
        with:
          name: niko-buddy-windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  # 发布草稿仅在同仓 tag push 且 build 完成后由本 job 创建：
  # --draft 保证无人为提升前永不公开（automated Latest 不可能）；
  # 已存在 release 直接拒绝，不 clobber/upload/edit。手动提升走外部授权流程。
  stage-release-draft:
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag' && github.repository == 'Smith-106/niko-buddy'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/download-artifact@v6
        with:
          name: windows-release-files
          path: release-assets
      - name: Check tag and verify staged release files
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(git rev-parse "${GITHUB_SHA}^{commit}")"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "${GITHUB_REF}^{commit}")"
          git merge-base --is-ancestor HEAD refs/remotes/origin/master
          node scripts/verify-windows-release-assets.mjs release-assets
      - name: Create and verify unpublished release draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          installer="release-assets/niko-buddy_${version}_windows_X64.exe"
          head_sha="$(git rev-parse HEAD)"
          tag_sha="$(git rev-parse --verify "$GITHUB_REF")"
          test "$(git rev-parse --verify "${tag_sha}^{commit}")" = "$head_sha"
          check_remote_tag() {
            local remote_sha
            remote_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq '.object.sha')" || return 1
            if [[ "$remote_sha" != "$tag_sha" ]]; then
              echo 'The remote release tag no longer binds the gated commit' >&2
              return 1
            fi
          }
          releases_json="$RUNNER_TEMP/release-drafts-and-published.json"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$releases_json"
          node -e 'const pages=require(process.argv[1]); if (!Array.isArray(pages) || pages.some(p=>!Array.isArray(p))) throw new Error("Invalid release list"); if (pages.flat().some(r=>r.tag_name===process.env.GITHUB_REF_NAME)) throw new Error("Release already exists; refusing to change it")' "$releases_json"
          check_remote_tag
          gh release create "$GITHUB_REF_NAME" "$installer" "$installer.sig" \
            "release-assets/niko-buddy_${version}_windows_X64_portable.exe" release-assets/latest.json \
            --repo "$GITHUB_REPOSITORY" --title "Niko Buddy $GITHUB_REF_NAME" \
            --notes-file release-assets/release-notes.txt --verify-tag --target "$head_sha" --draft --latest=false
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$releases_json"
          draft_id="$(node -e 'const r=require(process.argv[1]).flat().filter(r=>r.tag_name===process.env.GITHUB_REF_NAME); if(r.length!==1 || !r[0].draft || r[0].published_at!=null || !Number.isSafeInteger(r[0].id) || r[0].id<=0)process.exit(1); console.log(r[0].id)' "$releases_json")"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases/$draft_id/assets" > "$RUNNER_TEMP/release-assets.json"
          node scripts/verify-windows-release-assets.mjs release-assets "$RUNNER_TEMP/release-assets.json"
          check_remote_tag
