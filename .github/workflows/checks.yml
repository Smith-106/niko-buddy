# checks.yml - reusable Node-side gate definitions (R17 B1 extraction)
#
# Single source of truth for the Node gate run definitions. Callers
# (ci.yml, build.yml ci-gate) call this workflow via workflow_call `uses:`
# and must NOT re-declare the same gate runs elsewhere (uniqueness
# assertions, R17 section 4.3).
#
# Batch notes:
# - B1: verbatim extraction from ci.yml / build.yml ci-gate. Every run string
#   is byte-level conserved (only positions move; npm install kept for this
#   batch - npm ci migration = B2). The bare typecheck that used to live at
#   build.yml:35 is PROMOTED to the forced form below (R17 section 4.4; the
#   forced form must never be downgraded back to bare typecheck).
# - B1: KB view self-consistency + governance anchors REMAIN in ci.yml
#   (R17 section 4.4 final decision - they stay with the caller; B5 merges
#   the KB view check into the generated-artifacts gate and deletes the
#   inline step from ci.yml).
# - B5: generated-artifacts gate step (5 checks incl. commands-doc) lands in
#   node-gates below; the KB view self-consistency check is covered by that
#   gate (B3 checkKbRoutingView), so ci.yml carries no duplicate.
# - run-e2e input is declared in B1 but not consumed yet: E2E stays in the
#   caller in B1 (exec-plan P0-3); later batches wire it.
# - M0 fix (2026-09-09): B1's install/node-gates split silently dropped the
#   checkout from node-gates (job workspaces do not persist across jobs),
#   so CI ran npm in an empty workspace (ENOENT package.json, run 34261789514).
#   Merged back into a single self-sufficient job: checkout + setup + npm ci
#   + gates. Gate run strings are unchanged (uniqueness assertions hold).

name: Node Gates (reusable)

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version for setup-node
        required: true
        type: string
      run-e2e:
        description: Run E2E steps (declared in B1, wired by later batches)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  node-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Dependency audit gate
        # 依赖漏洞回归守卫（quality-auto-test 20260914）：audit fix 修复 2H/4M/1L 后
        # 基线归零；本门防 high/critical 复发，moderate 及以下不阻塞（追踪见
        # .workflow/sessions quality-auto-test run report）。
        # 2026-10-03 起走 scripts/audit-gate.mjs：JSON 全量审查 + 显式例外清单
        # （GHSA-vfj7-8cjw-p6xm 无上游 patch，dev-only，不进产物）；裸 audit 门对
        # 无修复版 advisory 永久红灯，改用显式例外 + 自动复查（braces 发新版即失效）。
        run: node scripts/audit-gate.mjs

      - name: Typecheck (tsc, force)
        # ADR-47 回归防线：--force 禁增量缓存假绿（e2522af6 教训）
        run: npm run typecheck:force

      # NOTE (R17 4.4): the bare typecheck that used to live at build.yml:35
      # (release ci-gate) is deliberately NOT re-created anywhere - it is
      # promoted to the forced form in the step above. Each caller invokes
      # this workflow once, so exactly one definition exists. The forced form
      # is pinned by F3 criteria and must never be downgraded.

      - name: Lint (eslint, 68 号 P1-9 接入)
        run: npm run lint

      - name: Frontend/backend consistency gate
        # 前后端一致性机械门（scripts/check-consistency.mjs）：
        #   invoke ↔ #[tauri::command] ↔ generate_handler! 三方闭合、IPC 实参名
        #   ⊆ Rust 形参、事件 topic 有发射方、i18n 键集等价、视图 union 可渲染、
        #   版本单一真源、插件 ↔ capabilities、atlas 统计自洽。
        run: npm run consistency

      - name: Run unit tests (vitest)
        run: npm run test:mocks

      - name: Generated artifacts check
        # P0 B5 + K-3: 7 项生成物闭环门禁（t2s-map / thresholds / kb-routing-view /
        # seeds / commands-doc / module-atlas / internal-eval-set）。KB view 自洽检查
        # 自 B3 起并入本步（原 ci.yml 内联 step 已删除，R17 4.4 无双重定义）。
        run: npm run gen:check

      - name: Build frontend (vite build)
        # R3-E05：自 ci.yml 三平台矩阵去重迁入 node-gates 单次快速前端构建门禁。
        run: npx vite build

      - name: Consensus anti-goals gate
        run: node scripts/guard-consensus-antigoals.mjs

      - name: Curation debt gate
        run: node scripts/check-curation-debt.mjs

      - name: Consensus anchors gate
        run: node scripts/verify-consensus-anchors.mjs

      - name: Governance anchors check
        # ADR-47 回归防线：治理文档（arch-decisions/project.md）声称的文件:行锚点可解析（R2-E06：自 ci.yml 三平台矩阵迁至 node-gates 单次运行）
        run: node scripts/verify-governance-anchors.mjs

      - name: Test file naming gate (P2-4)
        # 白名单收敛断言：仓内不得再出现 tracked / ignored-漏网的 *.test.*
        # （vitest 收集面统一 .spec/.test 双宽，但 git 面只收 .spec；.
        # .novel/.workflow 忽略行是保险丝，不在此断言范围）。
        run: |
          set -e
          TRACKED=$(git ls-files | grep -E '\.test\.[cm]?[jt]sx?$' | wc -l)
          LEAKED=$(git ls-files --others --ignored --exclude-standard -- src/ | grep -E '^src/.*\.test\.[cm]?[jt]sx?$' | wc -l)
          if [ "$TRACKED" -ne 0 ] || [ "$LEAKED" -ne 0 ]; then
            echo "::error::P2-4 gate: tracked=$TRACKED leaked=$LEAKED (src 内 .test.* 必须为 .spec.*)"
            git ls-files | grep -E '\.test\.[cm]?[jt]sx?$' || true
            git ls-files --others --ignored --exclude-standard -- src/ | grep -E '^src/.*\.test\.[cm]?[jt]sx?$' || true
            exit 1
          fi
          echo "P2-4 naming gate OK (tracked=0 leaked=0)"

  analytics-worker:
    # exec-plan P1-1 + 登记簿 v2 glm-ADD-1 过渡编译门（transitional gate）。
    # 撤除触发器（removal trigger）= worker CI 正式化记录（独立的 worker 仓/
    # 专属 workflow 建立时，本门标注 transitional 的条款即解除并迁移）。
    # 降级路径（R16）：wrangler dry-run 若因凭据形态不可用，退 tsc-only。
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analytics-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install worker dependencies (independent lockfile)
        run: npm ci

      - name: Typecheck worker (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Wrangler deploy dry-run (no credentials required)
        # R16 预演结论（2026-09-10 本地）：wrangler 3.x --dry-run 不校验凭据，
        # 无需 dummy vars；失败时降级 tsc-only（后续批次按需补 continue-on-error）
        run: npx wrangler deploy --dry-run --outdir /tmp/wrangler-dryrun

  rust-clippy:
    # R3-E05 / NON_BLOCKING-02：Rust Clippy 硬门禁（-D warnings），复用 ci.yml
    # Ubuntu 22.04 Tauri 系统依赖与 rust-cache，单平台拦截全部 lib 告警。
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install Rust stable with clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install dependencies (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            protobuf-compiler

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Ensure Linux PDFium resource placeholder for tauri-build
        run: mkdir -p src-tauri/pdfium && : > src-tauri/pdfium/libpdfium.so

      - name: Run cargo clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --lib -- -D warnings
