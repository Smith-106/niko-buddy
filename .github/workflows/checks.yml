# checks.yml - reusable Node-side gate definitions (R17 B1 extraction)
#
# Single source of truth for the Node gate run definitions. Callers
# (ci.yml, build.yml ci-gate) call this workflow via workflow_call `uses:`
# and must NOT re-declare the same gate runs elsewhere (uniqueness
# assertions, R17 section 4.3).
#
# Batch notes:
# - B1: verbatim extraction from ci.yml / build.yml ci-gate. Every run string
#   is byte-level conserved (only positions move; npm install kept for this
#   batch - npm ci migration = B2). The bare typecheck that used to live at
#   build.yml:35 is PROMOTED to the forced form below (R17 section 4.4; the
#   forced form must never be downgraded back to bare typecheck).
# - B1: KB view self-consistency + governance anchors REMAIN in ci.yml
#   (R17 section 4.4 final decision - they stay with the caller; B5 merges
#   the KB view check into the generated-artifacts gate and deletes the
#   inline step from ci.yml).
# - B5: generated-artifacts gate step (5 checks incl. commands-doc) lands in
#   node-gates below; the KB view self-consistency check is covered by that
#   gate (B3 checkKbRoutingView), so ci.yml carries no duplicate.
# - run-e2e input is declared in B1 but not consumed yet: E2E stays in the
#   caller in B1 (exec-plan P0-3); later batches wire it.
# - M0 fix (2026-09-09): B1's install/node-gates split silently dropped the
#   checkout from node-gates (job workspaces do not persist across jobs),
#   so CI ran npm in an empty workspace (ENOENT package.json, run 34261789514).
#   Merged back into a single self-sufficient job: checkout + setup + npm ci
#   + gates. Gate run strings are unchanged (uniqueness assertions hold).

name: Node Gates (reusable)

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version for setup-node
        required: true
        type: string
      run-e2e:
        description: Run E2E steps (declared in B1, wired by later batches)
        required: false
        default: false
        type: boolean

jobs:
  node-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck (tsc, force)
        # ADR-47 回归防线：--force 禁增量缓存假绿（e2522af6 教训）
        run: npm run typecheck:force

      # NOTE (R17 4.4): the bare typecheck that used to live at build.yml:35
      # (release ci-gate) is deliberately NOT re-created anywhere - it is
      # promoted to the forced form in the step above. Each caller invokes
      # this workflow once, so exactly one definition exists. The forced form
      # is pinned by F3 criteria and must never be downgraded.

      - name: Lint (eslint, 68 号 P1-9 接入)
        run: npm run lint

      - name: Run unit tests (vitest)
        run: npm run test:mocks

      - name: Generated artifacts check
        # P0 B5: 5 项生成物闭环门禁（t2s-map / thresholds / kb-routing-view /
        # seeds / commands-doc）。KB view 自洽检查自 B3 起并入本步（原 ci.yml
        # 内联 step 已删除，R17 4.4 无双重定义）。
        run: npm run gen:check

  analytics-worker:
    # exec-plan P1-1 + 登记簿 v2 glm-ADD-1 过渡编译门（transitional gate）。
    # 撤除触发器（removal trigger）= worker CI 正式化记录（独立的 worker 仓/
    # 专属 workflow 建立时，本门标注 transitional 的条款即解除并迁移）。
    # 降级路径（R16）：wrangler dry-run 若因凭据形态不可用，退 tsc-only。
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analytics-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install worker dependencies (independent lockfile)
        run: npm ci

      - name: Typecheck worker (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Wrangler deploy dry-run (no credentials required)
        # R16 预演结论（2026-09-10 本地）：wrangler 3.x --dry-run 不校验凭据，
        # 无需 dummy vars；失败时降级 tsc-only（后续批次按需补 continue-on-error）
        run: npx wrangler deploy --dry-run --outdir /tmp/wrangler-dryrun
