[package]
name = "niko-buddy"
version = "2.6.1"
description = "Niko Buddy - A memory-based AI writing desktop system for long-form novels"
authors = ["Smith-106"]
edition = "2021"
default-run = "niko-buddy"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "niko_buddy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "niko-buddy"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["clock"] }
tauri-plugin-dialog = "2.7.1"
tauri-plugin-updater = "2"
pdfium-render = "0.9"
tauri-plugin-store = "2.4.2"
tauri-plugin-http = { version = "2", features = ["unsafe-headers"] }
zip = "2"
calamine = "0.34.0"
docx-rs = "0.4.20"
cfb = "0.7.3"
encoding_rs = "0.8.35"
lancedb = "0.27.2"
# petgraph (T12, blueprint §10 line 441): read-side in-memory graph
# traversal over temporally/cognitively filtered edge sets (BFS depth=3 /
# connected components / topo sort). Storage semantics unchanged.
petgraph = "0.8"
# tokio provided by tauri runtime for async commands
arrow-array = "57"
arrow-schema = "57"
futures = "0.3"
# Claude Code CLI subprocess transport: spawn `claude` as a child process,
# stream stdout line-by-line back to the frontend. tokio::process gives us
# async io and clean cancellation; `which` locates the binary on PATH.
tokio = { version = "1", features = ["process", "io-util", "sync", "macros", "rt"] }
which = "7"
uuid = { version = "1", features = ["v4"] }
toml = "0.8"
# Multimodal image extraction (Phase 1):
#   `image` re-encodes pdfium's raw bitmap output to PNG so the IPC
#   payload is self-contained (the frontend doesn't need to know
#   about pdfium's internal RGBA layout).
#   `base64` serializes binary image data for Tauri IPC, which is
#   JSON-only — Vec<u8> roundtrips ~1.33× larger than raw bytes but
#   that's acceptable for our ~MB-scale per-image payloads.
#   `sha2` is for the dedup cache (Phase 3) — same image hash =
#   same caption, no redundant VLM calls. Pulled in here so the
#   extraction layer can also expose the hash if a caller wants it.
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
sha2 = "0.10"
md-5 = "0.10"
notify = "8"
walkdir = "2"
tauri-plugin-single-instance = "2"
# T34 sentinel hardening (TASK-P6-34): structured leveled logging
# (replaces scattered eprintln/println over time; stage-output journal stays a
# separate artifact channel and is NOT routed through the log plugin) + window
# state persistence (size/position restore across restarts).
tauri-plugin-log = "2"
# log facade (DEBT-20260822-t34-log-sweep): leveled log::error!/warn!/info!/debug!
# macros in commands layer, consumed by the tauri-plugin-log wiring in lib.rs.
log = "0.4"
tauri-plugin-window-state = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
# proptest (T11): property-based tests for canon temporal invariants /
# migration-chain idempotency / ingest_digest dedup. dev-dep only —
# never enters the release binary (consistent with blueprint §9.4).
proptest = "1"

# windows 链仅 Windows 目标编译：windows-core::imp::IMarshal 仅在
# cfg(windows) 下存在，非 Windows 平台编译 windows-future 必炸 E0425。
# 代码侧 use 已全部 cfg(target_os="windows") 门控（lib.rs/power.rs）。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Power"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
# Unwind (not abort) so third-party parser panics can be caught at the
# Tauri command boundary via panic_guard and turned into errors. Slightly
# larger binary, but prevents single-file corruption from killing the app.
panic = "unwind"
strip = true
